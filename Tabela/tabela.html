<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelinha de pixel art</title>
    <link rel="stylesheet" href="tabela.css">
</head>
<body>
    <!-- BOTÃO VOLTAR -->
    <button class="btn"><a href="../index.html">Voltar</a></button>

    <div class="container">
        <header>
            <h1>Comidas em Pixel Art</h1>
            <p>Confira os docinho em pixel!</p>
        </header>

        <div class="tabelinha">
            <table>
                <!-- COLUNAS -->
                <tr class="colunas">
                    <th>COMIDINHAS</th>
                    <th>COR PRINCIPAL</th>
                    <th>SABOR</th>
                </tr>

                <tr>
                    <td><img src="https://i.pinimg.com/736x/9b/6e/29/9b6e2904ab3f2ab07b55675f4abfa703.jpg" alt=""></td>
                    <td id="verde">Verde</td>
                    <td>Bolinho de Limão</td>
                </tr>

                <tr>
                    <td><img src="https://i.pinimg.com/736x/8b/83/3b/8b833b837b2f21989396914b54a0a62d.jpg" alt=""></td>
                    <td id="rosa">Rosa</td>
                    <td>Bolinho de Morango</td>
                </tr>

                <tr>
                    <td><img src="https://i.pinimg.com/736x/b6/72/9c/b6729c6285b112841cba15a80af0b2dc.jpg" alt=""></td>
                    <td id="marrom">Marrom</td>
                    <td>Bolinho de Chocolate</td>
                </tr>
            </table>
        </div>

    </div>

</body>
</html>
